<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Last Frontier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/space_style.css" />
</head>
<body>
  <main class="wrap">
    <h1>The Last Frontier</h1>

    <div id="canvas" class="canvas" aria-label="space canvas">
      <img id="ship" class="ship" src="media/spaceship.png" alt="Spaceship" />
    </div>

    <div class="toolbar">
      <button id="startBtn" class="btn" type="button">Start</button>
      <button id="stopBtn" class="btn ghost" type="button">Stop</button>
      <button id="flipBtn"  class="btn ghost" type="button">Flip</button>

      <label class="speed">
        Speed
        <input id="speedRange" type="range" min="50" max="600" step="10" value="250" />
      </label>
    </div>
  </main>

  <script src="js/animate.js"></script>
</body>
</html>
